# Steam's tomb4.exe; toolchain evidence and limitations are in README.md.
[game]
name = "tomb4"
title = "Tomb Raider IV: The Last Revelation"
window_title = "Tomb Raider"
progress_exclude = ["jpt_*"]
dir = "orig/tomb4"
exe = "tomb4.exe"
checksums = "orig/tomb4.sha1"
original = "build/orig/tomb4.exe"
game_end = 0x49c880

[ghidra]
project = "tomb4"
search = ["~/data.local/work/ghidra_*", "~/opt/ghidra_*"]
functions = "build/functions_tomb4.csv"

[build]
cflags = ["/G5", "/Zp1", "/W3", "/O2", "/DNDEBUG", "/DWIN32", "/D_WINDOWS"]
crlf = true
ml = 'C:\masm613\bin\ml.exe'
bin = 'C:\msvc6sp3\bin'
include = ['C:\dx6\include', 'C:\msvc6sp3\include']
lib = ['C:\dx6\lib', 'C:\msvc6sp3\lib']

[symbols]
manifest = "refs/trx/docs/symbols/tr4.txt"
import_libs = [".wine/drive_c/msvc6sp3/lib", ".wine/drive_c/dx6/lib"]

[reference]
source = "refs/tomb4-legacy/TOMB4"
layout = { game = "", specific = "specific" }

[hooks]
progress = true  # every commit redraws docs/progress.svg
compare = true  # every compiled function matches the original
one_function = true  # one newly matching function per commit
no_comments = true  # no comments, tabs or CRs in src/
allow_diff = ["CreateZone", "AlterFOV", "OptomiseSkinningData", "GetSpheres", "GetJointAbsPosition", "UpdateDebris", "WildboarControl", "MummyControl", "InitTFormats", "InitResolution", "S_UpdateInput", "RefreshCamera", "TriggerFireFlame", "ControlTwoBlockPlatform", "ControlSpikeball", "Control4xFloorRoofBlade", "ControlBirdBlade", "ControlSethBlade", "FlameEmitter2Control", "ControlHammer", "ControlMineHelicopter", "TestBoundsCollide2", "InitialiseBike", "BikeCheckGetOff", "TestHeight", "DoDynamics_bike", "InitialiseJeep", "UserControl_bike", "JeepFireGrenade", "RopeCollision", "DrawSprite", "DrawPsxTile", "S_DrawHealthBar", "ScalesControl", "ProjectVerts", "ProjectTrainVerts", "FileOpen", "S_LoadLevelFile", "TestBlockPush", "SphinxControl", "TemplarControl", "ScorpionControl", "SmlscorpControl", "DoCredits", "LaraBaddieCollision", "ItemPushLaraStatic", "Move3DPosTo3DPos", "TroopControl", "SasControl", "LaraHangTest", "lara_as_stop", "ControlSmokeEmitter", "ControlEnemyMissile", "CalculateTarget", "TestBlockPull", "CreatureAIInfo", "MoveLaraPosition", "TrapObjects", "ControlBodyPart", "MovableBlockCollision", "TestLaraVault", "BuildOutsideTable", "CreatureTurn", "LoadItems", "LoadObjects", "S_DisplayMonoScreen", "RenderLoadPic", "DXClose", "LoadRooms", "WinMain", "WinMainWndProc", "DXSetCooperativeLevel", "PlayFmvNow", "FlameTorchControl", "UseInventoryItems", "GenericSphereBoxCollision", "DrawCutSeqActors", "mRotBoundingBoxNoPersp", "LoadGameflow", "SetCutSceneCamera", "S_CallInventory2", "setup_ammo_selector", "CalculateCamera", "ElementPuzzleCollision", "FlameEmitterControl", "ControlBurningFloor", "LaraGetNewTarget", "FlameEmitter3Control", "GameStixControl", "ControlRollingBall", "CreatureAnimation", "MoveCamera", "BinocularCamera", "GetCollidedObjects", "DrawAnimatingItem", "AlignLaraToRope", "LaraControl", "LookCamera", "GetTargetOnLOS", "CreateLightList", "ControlObelisk", "CalculateRope", "ControlClockworkBeetle", "DoGameflow", "BaboonControl", "DemigodCon