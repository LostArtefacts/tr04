# Steam's tomb4.exe; toolchain evidence and limitations are in README.md.
[game]
name = "tomb4"
title = "Tomb Raider IV: The Last Revelation"
window_title = "Tomb Raider"
progress_exclude = ["jpt_*"]
dir = "orig/tomb4"
exe = "tomb4.exe"
checksums = "orig/tomb4.sha1"
original = "build/orig/tomb4.exe"
game_end = 0x49c880

[ghidra]
project = "tomb4"
search = ["~/data.local/work/ghidra_*", "~/opt/ghidra_*"]
functions = "build/functions_tomb4.csv"

[build]
cflags = ["/G5", "/Zp1", "/W3", "/O2", "/DNDEBUG", "/DWIN32", "/D_WINDOWS"]
crlf = true
ml = 'C:\masm613\bin\ml.exe'
bin = 'C:\msvc6sp3\bin'
include = ['C:\dx6\include', 'C:\msvc6sp3\include']
lib = ['C:\dx6\lib', 'C:\msvc6sp3\lib']

[symbols]
manifest = "refs/trx/docs/symbols/tr4.txt"
import_libs = [".wine/drive_c/msvc6sp3/lib", ".wine/drive_c/dx6/lib"]

[reference]
source = "refs/tomb4-legacy/TOMB4"
layout = { game = "", specific = "specific" }

[dll]
ldflags = ["/DLL", "/NODEFAULTLIB", "/ENTRY:DllMain", "/BASE:0x30000000", "/SECTION:.text,RWE"]  # as the original's: the software renderer's spans patch their own code

[exe]
cflags = ["/Gy"]
defines = ["TR4_EXE=1"]
# The original's import order: KERNEL32, USER32, GDI32, ADVAPI32, DDRAW, DINPUT, DSOUND, MSACM32, BINKW32, WINMM.
libs = ["dxguid.lib", "kernel32.lib", "user32.lib", "gdi32.lib", "advapi32.lib", "ddraw.lib", "dinput.lib",
        "dsound.lib", "msacm32.lib", "binkw32.lib", "winmm.lib", "libc.lib"]
import_defs = ["config/binkw32.def"]  # binkw32.dll's 9 imports, from the original's import table
ldflags = ["/SUBSYSTEM:WINDOWS", "/FIXED", "/SECTION:.text,RWE"]
features = { c_asm = "FEAT_C_ASM" }  # FEAT=c_asm: the C versions of the original's hand-written assembly

[hooks]
progress = true  # every commit redraws docs/progress.svg
compare = true  # every compiled function matches the original
one_function = true  # one newly matching function per commit
no_comments = true  # no comments, tabs or CRs in src/
